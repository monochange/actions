name: ci
description: 'Decide which CI jobs run with the monochange ci CLI, verify main outcomes, and validate CI wiring.'
author: monochange
inputs:
  name:
    description: 'Internal action variant selector. Leave this as ci.'
    required: false
    default: ci
  mode:
    description: 'Action mode: decide (evaluate every [ci.jobs] id), verify (record main outcomes), or check (validate [ci] configuration and workflow wiring).'
    required: false
    default: decide
  setup-monochange:
    description: 'How to resolve monochange. true = auto-resolve (default), false = require existing monochange on PATH, any other string = custom command.'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory containing monochange.toml.'
    required: false
    default: '.'
  base:
    description: 'Git base ref for changed-file detection. Defaults to HEAD^1 on pull_request events, github.event.before on push, or origin/<default branch> otherwise.'
    required: false
    default: ''
  head:
    description: 'Git head ref for changed-file detection.'
    required: false
    default: HEAD
  provider:
    description: 'Decision provider override: opencode-go, openrouter, cloudflare, jev, openai-compatible, or graph. Defaults to [ci].provider.'
    required: false
    default: ''
  model:
    description: 'Model override for AI decision providers. Defaults to [ci].model.'
    required: false
    default: ''
  api-key:
    description: 'API key for the selected AI provider. Masked in logs.'
    required: false
    default: ''
  api-url:
    description: 'Provider endpoint URL override.'
    required: false
    default: ''
  cloudflare-account-id:
    description: 'Cloudflare account ID for the cloudflare provider.'
    required: false
    default: ''
  on-error:
    description: 'Reaction to a decide failure: run-all runs every job (default), fail fails the step.'
    required: false
    default: run-all
  auth-token:
    description: 'Repository-scoped CI auth token. Masked in logs.'
    required: false
    default: ''
  require-auth:
    description: 'Require repository-scoped authentication before reading or writing CI memory.'
    required: false
    default: 'false'
  repo-id:
    description: 'Canonical repository identity override.'
    required: false
    default: ''
  needs:
    description: 'Verify mode only. Pass ${{ toJSON(needs) }} from the job that verifies the gate.'
    required: false
    default: ''
  decisions:
    description: 'Verify mode only. Pass the gate job decisions output JSON.'
    required: false
    default: ''
  workflow:
    description: 'Check mode only. Comma- or newline-separated workflow files to scan for decisions references.'
    required: false
    default: ''
outputs:
  decisions:
    description: 'Decide mode: JSON object mapping every [ci.jobs] id to a boolean verdict, passed through verbatim from the CLI.'
  affected-packages:
    description: 'Decide mode: JSON array of affected package ids reported by the CLI.'
  run-all:
    description: 'Decide mode: true when every job should run. Also true when the action fails open with on-error: run-all.'
  result:
    description: 'Action execution status: success or failed.'
runs:
  using: node24
  main: ../dist/index.mjs
