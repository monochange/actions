name: post-merge-release
description: 'After a release PR merges, tag the release and publish packages.'
author: monochange
inputs:
  name:
    description: 'Internal action variant selector. Leave this as post-merge-release.'
    required: false
    default: post-merge-release
  setup-monochange:
    description: 'How to resolve monochange. true = auto-resolve (default), false = require existing monochange on PATH, any other string = custom command.'
    required: false
    default: 'true'
  ref:
    description: 'Git ref to inspect for a release record.'
    required: false
    default: 'HEAD'
  target-branch:
    description: 'Target branch the release PR merged into.'
    required: false
  base-branch:
    description: 'Optional default branch override for sync-release and open-next-cut. Defaults to the repository default branch.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token passed to monochange as GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  sync-release:
    description: 'Run open-sync-request from the default branch after publishing succeeds.'
    required: false
    default: 'false'
  open-next-cut:
    description: 'Immediately open the next sticky cut PR from the default branch when newer changesets already wait after publishing succeeds.'
    required: false
    default: 'false'
  dry-run:
    description: 'Show what would be done without tagging or publishing.'
    required: false
    default: 'false'
  debug:
    description: 'Enable extra debug logging.'
    required: false
    default: 'false'
outputs:
  result:
    description: 'success, skipped, dry-run, or failed.'
  tagged:
    description: 'Whether tags were created.'
  published:
    description: 'Whether packages were published.'
  json:
    description: 'Release record JSON.'
runs:
  using: node24
  main: ../dist/index.mjs
