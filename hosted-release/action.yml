name: hosted-release
description: 'Create the release commit and release pull request through monochange.dev and the monochange GitHub App.'
author: monochange
inputs:
  setup-monochange:
    description: 'How to resolve monochange (0.17.0 or newer). true = auto-resolve (default), false = require existing monochange on PATH, any other string = custom command.'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory to run monochange in.'
    required: false
    default: '.'
  hosted-url:
    description: "Base URL of the monochange app. The GitHub Actions OIDC token audience is this URL's host."
    required: false
    default: 'https://monochange.dev'
  release-command:
    description: 'Name of the monochange.toml command to run with MONOCHANGE_RELEASE_BACKEND=hosted, for example release. Runs its Command steps and stage_all like a local run. Requires monochange 0.20.0 or newer. Leave empty to run the built-in prepare, commit, and open release steps.'
    required: false
    default: ''
  github-token:
    description: 'Token passed to monochange as GITHUB_TOKEN and used to read the release commit and pull request back. With contents: write, monochange 0.20.0 or newer uploads the release files as a git tree so monochange.dev never receives their contents. Also needs pull-requests: read.'
    required: false
    default: ${{ github.token }}
  dry-run:
    description: 'Prepare the release and report the target branches without contacting the hosted app.'
    required: false
    default: 'false'
outputs:
  result:
    description: 'success, dry-run, or failed.'
  head-branch:
    description: 'Release pull request head branch.'
  base-branch:
    description: 'Release pull request base branch.'
  commit-sha:
    description: 'Release commit SHA on the head branch.'
  verified:
    description: 'Whether GitHub verified the release commit signature.'
  pull-request-number:
    description: 'Open release pull request number.'
  pull-request-url:
    description: 'Open release pull request URL.'
runs:
  using: node24
  main: ../dist/index.mjs
