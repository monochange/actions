name: monochange actions
description: 'Run monochange GitHub Action variants from a single entrypoint.'
author: monochange
branding:
  icon: git-merge
  color: purple
inputs:
  name:
    description: 'Action variant to run. Supported values: change-classification, merge, setup-monochange, changeset-policy, check, ci, release-preview, release-record, open-release-request, release-pr, hosted-release, tag-release, publish-readiness, publish-packages, post-merge-release, fail-when.'
    required: true
  setup-monochange:
    description: 'How to resolve monochange. true = auto-resolve (default), false = require existing monochange on PATH, any other string = custom command.'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token used to inspect and fast-forward pull requests.'
    required: false
    default: ${{ github.token }}
  repository:
    description: 'Target repository in owner/repo format.'
    required: false
    default: ${{ github.repository }}
  pull-request:
    description: 'Optional pull request number. Leave empty to use the current PR event context or auto-detect a single open release pull request.'
    required: false
  base-branch:
    description: 'Base branch that the release pull request must target.'
    required: false
    default: main
  head-branch-prefix:
    description: 'Required prefix for the release pull request head branch.'
    required: false
    default: monochange/release/
  merge-method:
    description: 'fast-forward preserves the checked PR head SHA. For divergent branches, cherry-pick replays commits with -x onto the base, updates the PR branch, and stops for fresh checks before another run.'
    required: false
    default: fast-forward
    type: choice
    options:
      - fast-forward
      - cherry-pick
  required-failing-check:
    description: 'Optional check name that is expected to fail before the merge update.'
    required: false
    default: release-pr-manual-merge-blocker
  allow-cross-repository:
    description: 'Whether pull requests from forks are allowed.'
    required: false
    default: 'false'
  require-green-checks:
    description: 'Whether all checks must be complete and successful apart from the expected failing check.'
    required: false
    default: 'true'
  minimum-reviewer-permission:
    description: 'Minimum repository permission the triggering actor must have for the merge to proceed. admin = repository admin (default), maintain = maintainer role, push = merge (insecure).'
    required: false
    default: admin
    type: choice
    options:
      - admin
      - maintain
      - push
  comment:
    description: 'Whether to post a pull request comment. Supported values: always, never, on-error.'
    required: false
    default: on-error
  dry-run:
    description: 'Resolve and validate the pull request without updating either branch or running post-update hooks.'
    required: false
    default: 'false'
  debug:
    description: 'Enable extra debug logging.'
    required: false
    default: 'false'
  update-branch-on-failure:
    description: 'When true, rebase a divergent PR head onto the base, push it with a lease, and stop for fresh checks before another merge run.'
    required: false
    default: 'false'
  post-update-script:
    description: 'Optional shell command after a rebase and PR branch push. Runs in the temporary git workspace without inherited action inputs or credentials; the action then stops for fresh checks.'
    required: false
  post-update-workflow:
    description: 'Optional workflow file path to dispatch via workflow_dispatch after a successful rebase and force-push. Runs on the base branch.'
    required: false
  trigger-command:
    description: 'Slash command that triggers this action when posted as a pull request comment. Only validated when the workflow runs from an issue_comment event.'
    required: false
    default: '/merge'
  should-fail:
    description: 'Boolean-like condition result for the fail-when variant. When true, fail-when writes outputs and a summary, optionally posts fail-comment to the PR, then fails with reason.'
    required: false
    default: 'false'
  reason:
    description: 'Failure reason shown in the thrown error, action summary, reason output, and optional pull request comment when should-fail is true.'
    required: false
    default: 'fail-when condition evaluated to true.'
  fail-comment:
    description: 'Optional markdown to include in a pull request comment when should-fail is true. If omitted, fail-when never calls the GitHub API.'
    required: false
    default: ''
  working-directory:
    description: 'Working directory to run monochange in.'
    required: false
    default: '.'
  base:
    description: 'Default-branch git ref for change-classification and the ci variant.'
    required: false
  head:
    description: 'Candidate git ref for change-classification and the ci variant.'
    required: false
    default: HEAD
  release:
    description: 'Release git ref override for change-classification.'
    required: false
  packages:
    description: 'Comma- or newline-separated package ids or names for change-classification and the ci variant.'
    required: false
  detection-level:
    description: 'Analysis level for change-classification: basic, signature, or semantic.'
    required: false
    default: signature
  dependency-propagation:
    description: 'Dependency propagation for change-classification: none or public.'
    required: false
    default: public
  include-unchanged:
    description: 'Include unchanged packages in change-classification.'
    required: false
    default: 'false'
  post-comment:
    description: 'Create or update one pull request comment for change-classification.'
    required: false
    default: 'true'
  ref:
    description: 'Git ref to inspect for release-record, tag-release, and publish-readiness.'
    required: false
    default: 'HEAD'
  format:
    description: 'monochange output format for variants that support it.'
    required: false
    default: 'json'
  diff:
    description: 'Whether release-preview should include a diff.'
    required: false
    default: 'true'
  output:
    description: 'Output artifact path for publish-readiness or publish-packages.'
    required: false
  resume:
    description: 'Previous publish result path to resume package publishing.'
    required: false
  fail-if-missing:
    description: 'Whether release-record should fail when no release record exists.'
    required: false
    default: 'false'
  id:
    description: 'Package or group id used by tag-release to select one tag from the tags map.'
    required: false
  package:
    description: 'Package or group id used by tag-release to select one tag from the tags map.'
    required: false
  readiness:
    description: 'Readiness artifact path used by publish-plan compatibility mode.'
    required: false
  all:
    description: 'Pass --all to publish-packages.'
    required: false
    default: 'false'
  stream-output:
    description: 'Pass --stream-output to publish-packages so package-manager output streams while still being captured in the publish report.'
    required: false
    default: 'false'
  hosted-url:
    description: "HTTPS base URL without embedded credentials of the monochange app that hosted-release delegates the release commit and pull request to. The GitHub Actions OIDC token audience is this URL's host."
    required: false
    default: 'https://monochange.dev'
  release-command:
    description: 'For hosted-release, the monochange.toml command to run with MONOCHANGE_RELEASE_BACKEND=hosted, for example release. Requires monochange 0.20.0 or newer. Leave empty to run the built-in release steps.'
    required: false
    default: ''
  from:
    description: 'Base git ref (e.g. origin/main) for changeset-policy instead of explicit changed paths. Requires a full-history checkout and enables API classification bump alignment: changesets that understate the classified impact fail the policy.'
    required: false
  mode:
    description: 'Mode for the ci variant: decide, verify, analytics, or auth.'
    required: false
    default: 'decide'
  job:
    description: 'CI job identifier for the ci variant.'
    required: false
    default: 'default'
  job-command:
    description: 'Command or description of the CI job for the ci variant.'
    required: false
    default: ''
  paths:
    description: 'Comma- or newline-separated path prefixes for the ci variant.'
    required: false
    default: ''
  provider:
    description: 'Decision API provider for the ci variant: opencode-go, openrouter, cloudflare, jev, openai-compatible, or graph.'
    required: false
    default: 'opencode-go'
  api-key:
    description: 'API key / bearer token for the ci variant.'
    required: false
    default: ''
  api-url:
    description: 'Custom decision endpoint URL for the ci variant.'
    required: false
    default: ''
  cloudflare-account-id:
    description: 'Cloudflare Account ID for the ci variant.'
    required: false
    default: ''
  model:
    description: 'AI model identifier for the ci variant (defaults to deepseek-v4.1).'
    required: false
    default: 'deepseek-v4.1'
  unconditional:
    description: 'Force the job to run unconditionally in the ci variant.'
    required: false
    default: 'false'
  unconditional-events:
    description: 'Comma-separated events that force an unconditional run in the ci variant.'
    required: false
    default: 'schedule,workflow_dispatch'
  unconditional-branches:
    description: 'Comma-separated branch globs that force an unconditional run in the ci variant.'
    required: false
    default: 'monochange/release/*,release/*,refs/tags/v*'
  unconditional-labels:
    description: 'Comma-separated PR labels that force an unconditional run in the ci variant.'
    required: false
    default: 'ci:full,ci:unconditional,release'
  unconditional-paths:
    description: 'Comma-separated global paths that force an unconditional run in the ci variant.'
    required: false
    default: 'Cargo.lock,rust-toolchain.toml,.github/workflows/'
  max-skips-on-main:
    description: 'Maximum consecutive conditional skips on main before forcing an unconditional run.'
    required: false
    default: '5'
  max-duration-minutes:
    description: 'Red-flag duration threshold in minutes for the ci variant.'
    required: false
    default: '10'
  duration-minutes:
    description: 'Observed or baseline duration in minutes for the ci variant.'
    required: false
    default: '0'
  outcome:
    description: 'Observed job outcome (success, failure, skipped) for verify mode in the ci variant.'
    required: false
    default: ''
  prior-decision:
    description: 'Prior decision (y or n) being verified in the ci variant.'
    required: false
    default: ''
  memory-path:
    description: 'Path to the CI decision ledger JSON file.'
    required: false
    default: '.monochange/ci-memory.json'
  auth-token:
    description: 'Optional repo-scoped token (or MONOCHANGE_CI_TOKEN) required to access repo history and analytics for the ci variant.'
    required: false
    default: ''
  repo-id:
    description: 'Optional canonical repository identifier override for the ci variant (defaults to GITHUB_REPOSITORY or normalized git remote origin).'
    required: false
    default: ''
  require-auth:
    description: "For the ci variant, require valid repo-scoped authentication before reading history or computing analytics (default: 'true' for analytics mode, 'false' otherwise unless auth-token or .monochange/ci-auth.json is present)."
    required: false
    default: ''
outputs:
  result:
    description: 'Final action result. For merge: fast-forwarded, updated (wait for fresh PR head checks and run again), or dry-run. For fail-when: skipped when should-fail is false and failed when the dispatcher catches the intentional failure.'
  failed:
    description: 'For fail-when, whether the action intentionally failed (true) or skipped (false).'
  reason:
    description: 'For fail-when, the failure reason when should-fail was true.'
  merged:
    description: 'Whether the pull request was merged into the base branch.'
  pull-request-number:
    description: 'Resolved pull request number. For hosted-release, the open release pull request.'
  pull-request-url:
    description: 'Resolved pull request URL. For hosted-release, the open release pull request.'
  base-sha:
    description: 'Base branch SHA before the fast-forward attempt.'
  head-sha:
    description: 'Checked head SHA, or the newly prepared PR head when result is updated.'
  fast-forward-sha:
    description: 'Commit SHA pushed to the base branch after a successful merge, or the candidate SHA reported during dry-run mode. Kept for backwards compatibility.'
  comment:
    description: 'JSON comment payload with a body field. For fail-when, this is the generated fail-comment body when provided.'
  rebased:
    description: 'Whether this run rebased and pushed the PR branch without updating the base branch.'
  json:
    description: 'JSON output for monochange command variants.'
  summary:
    description: 'Text summary for monochange command variants.'
  markdown:
    description: 'Rendered Markdown from change-classification.'
  recommendation:
    description: 'Overall proposed change-classification bump.'
  review-required:
    description: 'Whether change-classification contains evidence that requires review.'
  has-release-record:
    description: 'Whether a monochange release record exists at the requested ref.'
  tags:
    description: 'JSON map of release tags by package or group id.'
  tag:
    description: 'Selected release tag for a requested package or group id.'
  ready:
    description: 'Whether publish-readiness found a ready release record.'
  output-path:
    description: 'Path to the generated monochange artifact.'
  head-branch:
    description: 'Release pull request head branch reported by hosted-release.'
  base-branch:
    description: 'Release pull request base branch reported by hosted-release.'
  commit-sha:
    description: 'Release commit SHA that hosted-release created on the release branch.'
  verified:
    description: 'Whether GitHub verified the hosted-release commit signature.'
  decision:
    description: 'For ci, single-character decision: y or n.'
  should-run:
    description: 'For ci, boolean string matching decision (true or false).'
  unconditional:
    description: 'For ci, whether an unconditional rule forced the job to run.'
  suggestion:
    description: 'For ci, speedup suggestion when the job exceeds max-duration-minutes.'
  verdict-class:
    description: 'For ci verify mode: true_negative, false_negative, true_positive, or false_positive.'
  repo-id:
    description: 'For ci, canonical repository identifier used for repo-scoped authentication and analytics.'
  authenticated:
    description: 'For ci, whether a valid repo-scoped token or local auth file authenticated this run.'
  auth-token:
    description: 'For ci auth mode, the repo-scoped token created or validated. Treat it as a secret.'
  false-negatives:
    description: 'For ci, count of runs that did not run (n) but should have (failed on main).'
  false-positives:
    description: 'For ci, count of runs that ran (y) but did not need to (unaffected files and passed).'
  true-negatives:
    description: 'For ci, count of runs safely skipped (n) and verified green on main.'
  true-positives:
    description: 'For ci, count of runs that ran (y) and caught a failure or verified affected code.'
  analytics:
    description: 'For ci, JSON object with full repo CI gatekeeper analytics (false negatives, false positives, accuracy, saved minutes).'
runs:
  using: node24
  main: dist/index.mjs
