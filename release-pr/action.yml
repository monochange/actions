name: release-pr
description: 'Create or update the release pull request using monochange.'
author: monochange
inputs:
  name:
    description: 'Internal action variant selector. Leave this as release-pr.'
    required: false
    default: release-pr
  setup-monochange:
    description: 'How to resolve monochange. true = auto-resolve (default), false = require existing monochange on PATH, any other string = custom command.'
    required: false
    default: 'true'
  format:
    description: 'Output format for the release PR metadata.'
    required: false
    default: 'json'
  dry-run:
    description: 'Show what would be done without creating the PR.'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token used to create the pull request.'
    required: false
  working-directory:
    description: 'Working directory to run monochange in.'
    required: false
    default: '.'
  refresh:
    description: 'Force re-cutting an open sticky cut PR from the latest green commit on the base branch.'
    required: false
    default: 'false'
  banner-only:
    description: 'Update only the behind-main status banner on an open cut pull request without mutating branches.'
    required: false
    default: 'false'
  from:
    description: 'Optional base git ref or commit SHA to cut from.'
    required: false
    default: ''
  refresh-command:
    description: 'Pull request comment command that authorizes re-cutting an open cut PR.'
    required: false
    default: '/refresh'
  minimum-reviewer-permission:
    description: 'Minimum repository permission required to trigger /refresh via a pull request comment: admin, maintain (default), write, or push.'
    required: false
    default: 'maintain'
    type: choice
    options:
      - admin
      - maintain
      - write
      - push
  debug:
    description: 'Enable extra debug logging.'
    required: false
    default: 'false'
outputs:
  result:
    description: 'success, dry-run, or failed.'
  head-branch:
    description: 'Release PR head branch.'
  base-branch:
    description: 'Release PR base branch.'
  release-request-number:
    description: 'PR number.'
  release-request-url:
    description: 'PR URL.'
  json:
    description: 'Full JSON metadata.'
runs:
  using: node24
  main: ../dist/index.mjs
